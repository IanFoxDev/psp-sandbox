# Publishes clients/php to the read-only repository that Packagist tracks.
# Needs a secret SPLIT_TOKEN with write access to ianfoxdev/psp-sandbox-php.
# Without the secret the job does nothing, so forks and early pushes stay green.
name: split-php-client

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]

jobs:
  split:
    runs-on: ubuntu-latest
    env:
      SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
    steps:
      - if: env.SPLIT_TOKEN == ''
        run: echo "SPLIT_TOKEN is not set, skipping the split."
      - if: env.SPLIT_TOKEN != ''
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - if: env.SPLIT_TOKEN != ''
        uses: danharrin/monorepo-split-github-action@v2.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          package_directory: clients/php
          repository_organization: ianfoxdev
          repository_name: psp-sandbox-php
          branch: master
          tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          user_name: Anatoly Pankratyev
          user_email: ianfoxdeveloper@gmail.com
