# Publishes clients/php to the read-only repository that Packagist tracks.
# Needs a secret SPLIT_TOKEN with write access to ghuser/psp-sandbox-php.
name: split-php-client

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: danharrin/monorepo-split-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          package_directory: clients/php
          repository_organization: ghuser
          repository_name: psp-sandbox-php
          branch: master
          tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          user_name: Anatoly Pankratyev
          user_email: ianfoxdeveloper@gmail.com
